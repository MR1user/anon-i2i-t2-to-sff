name: sff-translation
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy=2.1.2
  - scipy=1.15.2
  - matplotlib=3.10.3
  - tqdm=4.67.1
  - pip:
      # PyTorch built for CUDA 11.8 (bundles its own CUDA runtime).
      # For CPU-only use, replace the next three lines with: torch==2.7.1
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.7.1+cu118
      - torchmetrics==1.7.4
